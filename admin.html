<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baki Group | Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f7f3ee',
                100: '#f0e4d8',
                500: '#b85d3c',
                700: '#7a3e2c',
                900: '#1e2a38'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f8f8f5 0%, #eef2f4 100%);
      }
      .glass {
        background: rgba(255,255,255,0.8);
        backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body class="text-slate-800 min-h-screen">
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
      <div class="glass max-w-md w-full rounded-3xl border border-slate-200 shadow-2xl p-8">
        <div class="text-center mb-8">
          <p class="text-xs uppercase tracking-[0.28em] text-brand-500 font-semibold">Baki Group</p>
          <h1 class="mt-3 text-3xl font-bold text-slate-900">Yönetim Girişi</h1>
        </div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label for="passwordInput" class="block text-sm font-medium text-slate-700 mb-2">Şifre</label>
            <input id="passwordInput" type="password" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="Şifrenizi girin" required />
          </div>
          <button type="submit" class="w-full px-5 py-3 rounded-xl bg-brand-500 text-white font-semibold hover:bg-brand-700 transition">Giriş Yap</button>
          <p id="loginError" class="hidden text-sm text-red-600 text-center">Şifre yanlış. Lütfen tekrar deneyin.</p>
        </form>
      </div>
    </div>

    <div id="adminApp" class="hidden max-w-7xl mx-auto px-4 py-10">
      <header class="glass rounded-2xl shadow-lg border border-slate-200 p-6 mb-8">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div>
            <p class="text-xs uppercase tracking-[0.28em] text-brand-500 font-semibold">Admin Panel</p>
            <h1 class="text-3xl font-bold text-slate-900">Proje Yönetimi</h1>
          </div>
          <div class="flex gap-3">
            <a href="index.html" class="px-4 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 transition">Siteye Git</a>
            <button id="logoutBtn" class="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700 transition">Çıkış</button>
          </div>
        </div>
      </header>

      <main class="grid lg:grid-cols-[1.1fr_0.9fr] gap-8">
        <section class="glass rounded-2xl shadow-lg border border-slate-200 p-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold text-slate-900">Yeni Proje Ekle</h2>
            <span id="saveStatus" class="text-xs text-slate-500">Hazır</span>
          </div>

          <form id="projectForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Proje Başlığı</label>
              <input id="title" type="text" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="Örn: Modern Yaşam Alanı" required />
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Açıklama</label>
              <textarea id="description" rows="4" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="Proje hakkında kısa açıklama..." required></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Resim URL</label>
              <input id="image" type="url" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="https://images.unsplash.com/..." />
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Resim Yükle</label>
              <input id="imageUpload" type="file" accept="image/*" class="w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-100 file:text-brand-700 file:font-medium hover:file:bg-brand-200" />
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Fiyat</label>
              <input id="price" type="text" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="₺1.250.000" />
            </div>

            <div class="flex flex-wrap gap-3 pt-2">
              <button type="submit" class="px-5 py-3 rounded-xl bg-brand-500 text-white font-semibold hover:bg-brand-700 transition">Projeyi Web Sitesinde Yayınla</button>
              <button id="saveLocalBtn" type="button" class="px-5 py-3 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 transition">Yalnızca Kaydet</button>
              <button id="resetBtn" type="button" class="px-5 py-3 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 transition">Temizle</button>
            </div>
          </form>
        </section>

        <aside class="space-y-8">
          <section class="glass rounded-2xl shadow-lg border border-slate-200 p-6">
            <h2 class="text-xl font-semibold mb-4 text-slate-900">Mevcut Projeler</h2>
            <div id="projectList" class="space-y-3"></div>
          </section>
        </aside>
      </main>
    </div>

    <div id="successToast" class="hidden fixed bottom-6 right-6 z-50 bg-emerald-500 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-semibold">
      Başarıyla Yayınlandı!
    </div>

    <script src="admin.js"></script>
  </body>
</html>
